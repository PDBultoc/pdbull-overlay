<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting Soon</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="starting.css">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body class="dark v1">
<div class="stage" id="stage">
  <div class="fill" id="gl"></div>
  <div class="fade" id="fade"></div>

  <!-- corner texts -->
  <div class="corner corner-tl"><span class="rule"></span>Campaign <b>·</b> Table</div>
  <div class="corner corner-tr">Welcome, <span id="follower">WhiteWolf</span><span class="rule"></span></div>

  <!-- age plate: a small engraved brass plate, shown for a few seconds when the village advances -->
  <div class="age-plate" id="agePlate"><i class="pin"></i><span id="ageName">Dark Age</span><i class="pin"></i></div>

  <!-- title block -->
  <div class="title-block" id="titleBlock">
    <div class="soon" id="soon">Starting soon</div>
    <div class="count" id="count">5:00</div>
    <div class="burn" id="burn"><div class="wax" id="wax"><i class="ember"></i><i class="smoke"></i></div></div>
    <div class="begin" id="begin">Here we go</div>
  </div>
</div>

<div class="panel" id="panel">
  <button data-v="1" class="on" title="orbit over the campaign map">1</button>
  <span class="sep"></span>
  <button id="bT10" title="countdown to 0:10">0:10</button>
  <button id="bEnd" title="countdown to 0">0:00</button>
  <button id="bReset" title="restart the countdown">reset</button>
  <button id="bAge" title="jump to the next age">next age</button>
  <button id="bFol" title="another follower">follower</button>
</div>

<script type="module" src="starting.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ambience test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  html, body { margin: 0; background: var(--walnut-950); color: var(--text-light); font-family: var(--font-ui); }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: radial-gradient(ellipse at 30% 20%, var(--walnut-800), var(--walnut-950) 70%); }
  main { width: min(720px, 92vw); padding: 40px; background: var(--walnut-900); border: 1px solid var(--brass-700);
         border-radius: 4px; box-shadow: var(--shadow-soft); }
  h1 { font-family: var(--font-title); font-weight: 600; letter-spacing: .08em; color: var(--brass-300); margin: 0 0 6px; font-size: 28px; }
  p.sub { margin: 0 0 28px; color: var(--text-dim); font-family: var(--font-serif); font-size: 18px; }
  button { font: 500 15px var(--font-ui); color: var(--text-light); background: var(--walnut-700); border: 1px solid var(--brass-600);
           padding: 10px 18px; border-radius: 3px; cursor: pointer; }
  button:hover { background: var(--walnut-600); }
  button.on { background: var(--brass-500); color: var(--ink-on-brass); border-color: var(--brass-300); }
  #start { display: block; width: 100%; font: 600 26px var(--font-title); letter-spacing: .1em; padding: 28px; margin-bottom: 24px;
           background: var(--brass-500); color: var(--ink-on-brass); border-color: var(--brass-300); }
  .row { display: flex; align-items: center; gap: 14px; margin: 14px 0; }
  .row label { width: 110px; color: var(--ivory-300); }
  .row input[type=range] { flex: 1; accent-color: var(--brass-400); }
  .row output { width: 42px; text-align: right; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .presets { display: flex; gap: 10px; margin: 22px 0 8px; }
  #result { margin-top: 18px; font: 14px/1.6 ui-monospace, Consolas, monospace; color: var(--ivory-300); white-space: pre-wrap; min-height: 3em; }
  hr { border: 0; border-top: 1px solid var(--walnut-600); margin: 22px 0; }
</style>
</head>
<body>
<main>
  <h1>Ambience</h1>
  <p class="sub">Candle, hearth and quill, generated live. Nothing is sampled.</p>
  <button id="start">Start sound</button>
  <div class="row"><button id="toggle">Sound: off</button></div>
  <div class="row"><label for="master">Master</label><input id="master" type="range" min="0" max="1" step="0.01" value="0.6"><output id="master-o">0.60</output></div>
  <hr>
  <div class="row"><label for="l-candle">Candle</label><input id="l-candle" data-layer="candle" type="range" min="0" max="1" step="0.01"><output></output></div>
  <div class="row"><label for="l-hearth">Hearth</label><input id="l-hearth" data-layer="hearth" type="range" min="0" max="1" step="0.01"><output></output></div>
  <div class="row"><label for="l-quill">Quill</label><input id="l-quill" data-layer="quill" type="range" min="0" max="1" step="0.01"><output></output></div>
  <div class="presets">
    <button data-preset="starting">Starting</button>
    <button data-preset="brb">BRB</button>
    <button data-preset="ending">Ending</button>
    <button id="level" style="margin-left:auto">Level check</button>
  </div>
  <div id="result"></div>
</main>
<script type="module">
import { createAmbience, PRESETS } from '../core/ambience.js';

const $ = (s) => document.querySelector(s);
const sliders = [...document.querySelectorAll('input[data-layer]')];
const result = $('#result');
let ac = null, amb = null, playing = false;

function showOut(inp) { inp.nextElementSibling.textContent = (+inp.value).toFixed(2); }
function currentMix() {
  const layers = {};
  for (const s of sliders) layers[s.dataset.layer] = +s.value;
  return { layers, master: +$('#master').value };
}
function applyPreset(name) {
  const p = PRESETS[name];
  for (const s of sliders) { s.value = p.layers[s.dataset.layer] ?? 0; showOut(s); if (amb) amb.set(s.dataset.layer, +s.value); }
  $('#master').value = p.master; $('#master-o').textContent = p.master.toFixed(2);
  if (amb) amb.setMaster(p.master);
  document.querySelectorAll('[data-preset]').forEach((b) => b.classList.toggle('on', b.dataset.preset === name));
}
function setPlaying(on) {
  playing = on;
  $('#toggle').textContent = 'Sound: ' + (on ? 'on' : 'off');
  $('#toggle').classList.toggle('on', on);
}
async function begin() {
  if (!ac) {
    ac = new AudioContext();
    amb = createAmbience(ac, currentMix());
    amb.output.connect(ac.destination);
  }
  await ac.resume();
  amb.start();
  setPlaying(true);
}
$('#start').addEventListener('click', begin);
$('#toggle').addEventListener('click', () => { if (playing) { amb.stop(800); setPlaying(false); } else begin(); });
$('#master').addEventListener('input', (e) => { $('#master-o').textContent = (+e.target.value).toFixed(2); if (amb) amb.setMaster(+e.target.value); });
for (const s of sliders) s.addEventListener('input', () => { showOut(s); if (amb) amb.set(s.dataset.layer, +s.value); });
document.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => applyPreset(b.dataset.preset)));

async function measure(label, mix, seconds = 20) {
  const sr = 48000;
  const oc = new OfflineAudioContext(2, sr * seconds, sr);
  const a = createAmbience(oc, mix);
  a.output.connect(oc.destination);
  a.start();
  const buf = await oc.startRendering();
  const d = buf.getChannelData(0);
  let peak = 0, sum = 0;
  const skip = Math.floor(sr * 2); // ignore the 1.5 s fade-in
  for (let i = skip; i < d.length; i++) { const v = Math.abs(d[i]); if (v > peak) peak = v; sum += d[i] * d[i]; }
  const rms = Math.sqrt(sum / (d.length - skip));
  const db = (x) => (20 * Math.log10(Math.max(x, 1e-9))).toFixed(1);
  const line = `AMBIENCE-LEVEL preset=${label} peakDb=${db(peak)} rmsDb=${db(rms)}`;
  console.log(line);
  result.textContent += line + '\n';
}

$('#level').addEventListener('click', async () => {
  result.textContent = 'Rendering 20 s ...\n';
  await measure('current', currentMix());
});

const q = new URLSearchParams(location.search);
applyPreset('starting');
if (q.get('levelcheck')) {
  (async () => {
    result.textContent = '';
    const which = q.get('preset') || 'all';
    const names = which === 'all' ? Object.keys(PRESETS) : [which];
    for (const n of names) await measure(n, { layers: PRESETS[n].layers, master: 1 });
    console.log('AMBIENCE-LEVEL done');
  })();
}
</script>
</body>
</html>

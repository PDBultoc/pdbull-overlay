<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Match banner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="matchbar.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="bg" id="bg"></div>
  <!-- banner is built by matchbar.js into #slot (top-right under the menu buttons, or top-left under the resource bar) -->
  <div class="slot" id="slot"></div>
</div>

<div class="panel" id="panel">
  <button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button>
  <span class="sep"></span>
  <button data-s="1v1">1v1</button><button data-s="2v2">2v2</button><button data-s="4v4">4v4</button>
  <span class="sep"></span>
  <button data-p="tl">position TL</button><button data-p="tr">position TR</button>
  <span class="sep"></span>
  <button id="btn-bg">Background</button>
</div>

<script type="module" src="matchbar.js"></script>
</body>
</html>

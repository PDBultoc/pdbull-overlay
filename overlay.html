<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDBull overlay</title>
<link rel="stylesheet" href="shared/tokens.css">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<style>html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px}
body.bg #stage{background:#0a0705 url("shared/game.webp") center/1920px 1080px no-repeat}
#stage>[data-mod]{position:absolute;inset:0;pointer-events:none}</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { createSettings, stableJson } from './core/settings.js';
import { createBus } from './core/bus.js';
import { modulesFor } from './core/registry.js';
import { startAutoUpdate } from './core/autoupdate.js';
import { createRemote } from './core/remote.js';
import { createPoller } from './core/aoe2.js';
import { createRatings } from './core/ratings.js';

const q = new URLSearchParams(location.search);
if (q.get('bg') === '1') document.body.classList.add('bg');   // review only, never default
if (q.get('cam') === '1') document.body.classList.add('cam'); // placeholder webcam, review only
const SCENE = q.get('scene') || '';
if (SCENE === 'casting') document.body.classList.add('scene-casting');
const playersOverride = Math.min(8, Math.max(0, parseInt(q.get('players'), 10) || 0)); // review only

const bus = createBus({ name: 'pdbull' });
const settings = createSettings();
const stage = document.getElementById('stage');
const live = new Map();
const ratings = createRatings(); // one RM 1v1 ELO lookup (cache + timeout) shared by the intro and the match banner

function unmountMod(name) {
  const m = live.get(name);
  if (!m) return;
  try { m.handle && m.handle.unmount && m.handle.unmount(); } catch (e) { console.error('unmount', name, e); }
  m.layer.remove();
  live.delete(name);
}

async function mountMod(name, cfg) {
  const layer = document.createElement('div');
  layer.dataset.mod = name;
  const entry = { layer, handle: null, cfgJson: stableJson(cfg) };
  live.set(name, entry);
  try {
    const mod = await import('./modules/' + name + '.js');
    if (live.get(name) !== entry) return;
    stage.appendChild(layer);
    entry.handle = mod.mount(layer, { settings, bus, cfg, latest: () => poller.latest(), reportStatus, playersOverride, ratings }) || null;
  } catch (e) {
    // a module that does not exist yet (or throws) is skipped; the others keep running
    console.warn('module skipped:', name, (e && e.message) || e);
    layer.remove();
  }
}

function sync() {
  const s = settings.get();
  const names = modulesFor(SCENE);
  for (const name of [...live.keys()]) if (!names.includes(name)) unmountMod(name);
  for (const name of names) {
    const cfg = (s.modules && s.modules[name]) || {};
    const m = live.get(name);
    if (!cfg.enabled) { unmountMod(name); continue; }
    if (!m) { mountMod(name, cfg); continue; }
    if (m.cfgJson !== stableJson(cfg)) { unmountMod(name); mountMod(name, cfg); }
  }
}

bus.on('settings', (p) => { if (p && typeof p === 'object') settings.patch(p); else sync(); });

const room = q.get('room') || '';
// The overlay only consumes: it never writes settings, so it never publishes them to the room
// (every room message counts against ntfy's daily limit). Room events go to the local bus;
// alerts dedup by event id, the intro by event id too. The dock reads status from the local bus,
// so no status relay to the room either.
const remote = createRemote({
  room,
  onSettings: (s) => settings.patch(s),
  onEvent: (type, payload) => bus.emit(type, payload),
  // own source name: the dock's room dot must not be flipped by the overlay's sync state
  onStatus: (st) => bus.emit('status', { ...st, source: 'room-overlay' }),
});
function reportStatus(st) { bus.emit('status', st); }

// casting scene: follow the chosen player's games; otherwise the streamer's own profile
const followId = () => (SCENE === 'casting' && settings.get().casting && settings.get().casting.followProfileId) || settings.get().profileId;
let pollerId = followId();
let poller = makePoller(pollerId);
function makePoller(id) {
  const p = createPoller({
    profileId: id,
    intervalSec: settings.get().pollSec || 20,
    onEvents: (evs) => { if (p === poller) for (const e of evs) bus.emit(e.type, { match: e.match }); },
    onStatus: (st) => {
      if (p !== poller) return; // a stopped poller's late reply must not report
      reportStatus(st);
      // deferred: the poller reports status BEFORE its events, and the banner must see match-start (intro wait) first
      if (st && st.ok) queueMicrotask(() => bus.emit('match-running', { match: poller.latest() }));
    },
  });
  return p;
}

settings.onChange(() => {
  sync();
  const id = followId();
  if (id !== pollerId) {
    poller.stop();
    pollerId = id;
    poller = makePoller(id);
    poller.start();
  }
});

const demos = (q.get('demo') || '').split(',').map((s) => s.trim()); // review only, never default
if (demos.includes('1')) { // review only: sample chat lines
  const msgs = [
    { user: 'NordicFox', text: 'hey! what map are we on today?' },
    { user: 'Extremely_Long_Name_25ch', text: 'knights hit at minute 14, hold the line!' },
    { user: 'ketchupKnight', text: 'gg that last fight was clean Kappa', emotes: '25:29-33' },
    { user: 'luna_pawn', text: 'Averyveryveryverylongwordwithoutanyspacesatalltotestwrapping' },
  ];
  setTimeout(() => msgs.forEach((m, i) => setTimeout(() => bus.emit('chat', m), i * 100)), 300);
}

// review only: ?demo=intro | sub | follow | bits50 | bits500 | bits1500 | donation emit one synthetic event each, once the
// target module has mounted (or after 2 s). &t=<sec> freezes that demo at <sec> into its timeline (deterministic capture,
// same as the harnesses): headless Edge on SwiftShader gets only a few slow frames and scene.js caps dt at 0.1 s per frame,
// so a live demo captured with --virtual-time-budget shows the first ~1 s of the animation, not the moment you asked for.
const DEMO_ME = { profileId: 551021, name: 'PDBull', civ: 'Franks', colorHex: '#405BFF' };
const DEMO_MATCH = {
  id: 'test-demo-1v1', running: true, mode: '1v1', map: 'Arabia',
  me: DEMO_ME, myTeam: [DEMO_ME],
  enemies: [[{ profileId: 1, name: 'SwedishGoblinTwitch', civ: 'Slavs', colorHex: '#FF0000' }]],
};
// ?demo=matchbar1v1 | matchbar4v4: the in-game match banner with a 25-char name (review only; test-* ids use sample ELOs)
const LONG = 'Ragnar_the_Unstoppable_01';
const mbP = (id, name, civ, colorHex) => ({ profileId: id, name, civ, colorHex });
const MB_1V1 = {
  id: 'test-mb-1v1', running: true, mode: '1v1', map: 'Arabia', me: DEMO_ME, myTeam: [DEMO_ME],
  enemies: [[mbP(2, LONG, 'Hindustanis', '#d8453a')]],
};
const MB_4V4_ME = mbP(551021, 'PDBull', 'Franks', '#3b78e0');
const MB_4V4 = {
  id: 'test-mb-4v4', running: true, mode: 'tg', map: 'Black Forest', me: MB_4V4_ME,
  myTeam: [MB_4V4_ME, mbP(11, 'Frostbite_Nils', 'Vikings', '#4fb15a'), mbP(12, 'kiwi_lancer', 'Persians', '#e0c53a'), mbP(13, 'DukeOfEdinburgh', 'Byzantines', '#3fc3cf')],
  enemies: [[mbP(21, LONG, 'Hindustanis', '#d8453a'), mbP(22, 'ShadowMonk', 'Mongols', '#a35bd0'), mbP(23, 'ElPollo88', 'Spanish', '#8f8f8f'), mbP(24, 'Teuton_Tony', 'Teutons', '#ec8a2e')]],
};
const DEMO_EVENTS = {
  matchbar1v1: { mod: 'matchbar', type: 'match-running', payload: () => ({ match: MB_1V1 }) },
  matchbar4v4: { mod: 'matchbar', type: 'match-running', payload: () => ({ match: MB_4V4 }) },
  intro: { mod: 'intro', type: 'match-start', payload: () => ({ type: 'match-start', match: DEMO_MATCH }) },
  sub: { mod: 'alerts', type: 'sub', payload: () => ({ type: 'sub', id: 'test-demo-sub', name: 'IronSquire', tier: '1', months: 1 }) },
  follow: { mod: 'alerts', type: 'follow', payload: () => ({ type: 'follow', id: 'test-demo-follow', name: 'IronSquire' }) },
  bits50: { mod: 'alerts', type: 'bits', payload: () => ({ type: 'bits', id: 'test-demo-bits50', name: 'IronSquire', amount: 50 }) },
  bits500: { mod: 'alerts', type: 'bits', payload: () => ({ type: 'bits', id: 'test-demo-bits500', name: 'IronSquire', amount: 500 }) },
  bits1500: { mod: 'alerts', type: 'bits', payload: () => ({ type: 'bits', id: 'test-demo-bits1500', name: 'IronSquire', amount: 1500 }) },
  donation: { mod: 'alerts', type: 'donation', payload: () => ({ type: 'donation', id: 'test-demo-donation', name: 'IronSquire', amount: 10, currency: 'USD', message: 'Great stream, commander! Here is some gold for the next castle.' }) },
};
const demoT = q.has('t') ? Math.max(0, parseFloat(q.get('t')) || 0) : null; // review only
async function freezeDemo(d, payload) {
  const h = live.get(d.mod) && live.get(d.mod).handle;
  if (d.mod === 'intro' && h && h.freezeAt) { await h.freezeAt(payload.match, demoT); document.title = 'ready'; return; }
  bus.emit(d.type, payload);
  if (!h || !h.debug) return;
  await h.debug.whenPlaying();
  await new Promise((r) => setTimeout(r, 150));
  h.debug.advance(demoT);
  document.title = 'ready';
}
for (const key of demos) {
  const d = DEMO_EVENTS[key];
  if (!d) continue;
  const t0 = Date.now();
  const timer = setInterval(() => {
    const ready = live.get(d.mod) && live.get(d.mod).handle;
    if (!ready && Date.now() - t0 < 2000) return;
    clearInterval(timer);
    if (demoT != null) freezeDemo(d, d.payload()).catch((e) => console.warn('demo freeze failed', (e && e.message) || e));
    else bus.emit(d.type, d.payload());
  }, 100);
}

sync();
bus.emit('settings-request', {});
remote.start();
poller.start();
startAutoUpdate();
</script>
</body>
</html>
